[tool.poetry]
name = "linguasign-ai"
version = "0.1.0"
description = "Sign Language Kinematics-to-Kinematics Translation Tool using 3D avatars"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
# Python 3.12 required — MediaPipe 0.10.x is incompatible with Python 3.13+
python = ">=3.12,<3.13"
opencv-python = "^4.8.0"
# mediapipe: pin to tested minor — 0.10.x tested on Python 3.12 (3.13 incompatible)
mediapipe = "^0.10.14"
# numpy: 1.26 is latest stable 1.x — avoid 2.0 which has breaking API changes
numpy = "^1.26.0,<2.0.0"
pandas = "^2.0.0"
scikit-learn = "^1.3.0"
scipy = "^1.11.0"
matplotlib = "^3.7.0"
Pillow = "^10.0.0"
# Socket.IO: python-socketio 5.x uses protocol v4 — JS client must be socket.io-client ^4.7.x
python-socketio = "^5.9.0"
python-engineio = "^4.7.0"
# Phase 6 (Avatar MVP) — uncomment when starting Phase 6:
# fastapi = "^0.115.0"
# uvicorn = {extras = ["standard"], version = "^0.32.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = ">=6.0.0,<7.0.0"
pylint = "^2.17.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
